[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "filevow"
version = "0.1.1"
description = "Three-layer file integrity monitoring: SHA-256, RSA-PSS signed records and an encrypted mirror vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "cryptography>=43",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "keyring>=25",
    "zstandard>=0.23",
    "APScheduler>=3.10,<4",
    "watchdog>=5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "PyJWT>=2.9",
    "httpx>=0.27",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
desktop = ["plyer>=2.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
filevow = "filevow.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/filevow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/**" = ["E501", "S105"]  # dev-only demo content and demo credentials

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses these calls as parameter defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends", "fastapi.params.Query"]
